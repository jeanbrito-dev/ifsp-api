services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ifsp_eventos
      POSTGRES_USER: ifsp_eventos
      POSTGRES_PASSWORD: ifsp_eventos
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ifsp_eventos -d ifsp_eventos']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
