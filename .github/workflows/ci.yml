name: API CI
on: { push: { branches: [develop, main] }, pull_request: { branches: [develop, main] } }
jobs:
  api-ci:
    name: api-ci
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ifsp_eventos:ifsp_eventos@localhost:5432/ifsp_eventos?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm run prisma:validate
        working-directory: api
      - run: npm run prisma:generate
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm test
        working-directory: api
      - run: npm run build
        working-directory: api
